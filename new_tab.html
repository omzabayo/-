<!doctype html><html><head><meta charset="utf-8"><title>New tab</title><style>
:root{--font:system-ui}*{box-sizing:border-box}body{margin:0;background:#151922;color:#dce0e8;font-family:var(--font);color-scheme:dark}main{max-width:660px;margin:14vh auto;padding:32px;text-align:center}.mark{margin:auto;width:56px;height:56px;border:1px solid #65522d;border-radius:14px;display:grid;place-items:center;color:#d8ad53;font-size:28px}h1{font-size:28px;letter-spacing:3px;margin:24px 0 8px;font-weight:600}p{font-size:13px;color:#8b93a2;line-height:1.8}form{display:flex;gap:8px;margin-top:32px;padding:6px;background:#10141c;border:1px solid #343a46;border-radius:8px}input{flex:1;min-width:0;background:transparent;border:0;color:#e1e5ec;padding:12px;font:inherit;outline:none}button{border:0;border-radius:5px;background:#d8ad53;color:#151515;min-height:40px;padding:8px 20px;font:inherit;cursor:pointer}a{color:#aa9270;font-size:12px;text-decoration:none}.hint{margin-top:24px}.divider{width:48px;height:1px;background:#343a46;margin:32px auto}
</style></head><body><main><h1>HexBot PB MOBILE</h1><p>Your own space for every account.</p><form id="form"><input id="url" aria-label="Website address" placeholder="Enter a website address" autocomplete="off" spellcheck="false"><button>Open</button></form><p class="hint">Use New profile on the left to open another isolated session.<br>Record, edit and replay a macro in the right panel.</p><div class="divider"></div><a href="/test">Open local automation test page</a><p id="error"></p></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();try{let raw=document.querySelector('#url').value.trim();if(!raw)return;const u=new URL(raw.includes('://')?raw:'https://'+raw);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw new Error();location.href=u.href}catch(_){document.querySelector('#error').textContent='Enter a valid http or https address.'}};</script></body></html>
